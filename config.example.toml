# kb runtime config.
#
# Set APP_CONFIG to point at this file if you want to load a TOML config.
# TOML sections currently accepted by internal/config:
# - `[app]`
# - `[log]`
# - `[vault]`
# - `[firecrawl]`
# - `[openrouter]`
# - `[stt]`
# - `[youtube]`
#
# Primary CLI surface is configured through commands and flags:
# - `kb topic {new,list,info}`
# - `kb ingest {url,file,youtube,codebase,bookmarks}`
# - `kb lint`
# - `kb inspect ...`
# - `kb index`
# - `kb search`
#
# Runtime values and overrides loaded from the environment by internal/config:
# - APP_CONFIG
# - FIRECRAWL_API_KEY
# - FIRECRAWL_API_URL
# - OPENROUTER_API_KEY
# - OPENROUTER_API_URL
# - OPENAI_API_KEY
# - OPENAI_API_URL
# - STT_PROVIDER
# - STT_MODEL
# - YOUTUBE_YT_DLP_PATH
# - YOUTUBE_PROXY
# - YOUTUBE_COOKIES_FILE
# - YOUTUBE_USER_AGENT
#
# `openrouter.stt_model` is currently TOML-backed rather than env-overridden.

[app]
name = "kb"
env = "development"

[log]
level = "info"

[vault]
root = "."
topic_globs = ["*"]

[firecrawl]
api_key = ""
api_url = "https://api.firecrawl.dev"

[openrouter]
api_key = ""
api_url = "https://openrouter.ai/api"
stt_model = "google/gemini-2.5-flash"

[stt]
provider = "openai"
api_key = ""
api_url = "https://api.openai.com"
model = "gpt-4o-transcribe"
language = "auto"
prompt = ""
audio_format = "mp3"
chunk_duration = "10m"
max_chunk_bytes = 24000000
concurrency = 2
ffmpeg_path = "ffmpeg"

[youtube]
yt_dlp_path = "yt-dlp"
proxy = ""
cookies_file = ""
user_agent = ""
transcription = "captions"
retry_attempts = 3
retry_backoff = "1s"

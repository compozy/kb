# kb runtime config.
#
# Set APP_CONFIG to point at this file if you want to load a TOML config.
# TOML sections currently accepted by internal/config:
# - `[app]`
# - `[log]`
# - `[vault]`
# - `[okf]`
# - `[firecrawl]`
# - `[openrouter]`
# - `[stt]`
# - `[youtube]`
# - `[instagram]`
# - `[decisions]` (plus `[decisions.thresholds]`)
# - `[generation]`
#
# Primary CLI surface is configured through commands and flags:
# - `kb topic {new,list,info}`
# - `kb ingest {url,file,youtube,channel,instagram,codebase,bookmarks}`
# - `kb lint`
# - `kb inspect ...`
# - `kb index`
# - `kb search`
#
# Runtime values and overrides loaded from the environment by internal/config:
# - APP_CONFIG
# - FIRECRAWL_API_KEY
# - FIRECRAWL_API_URL
# - OPENROUTER_API_KEY
# - OPENROUTER_API_URL
# - OPENAI_API_KEY
# - OPENAI_API_URL
# - STT_PROVIDER
# - STT_MODEL
# - YOUTUBE_YT_DLP_PATH
# - YOUTUBE_PROXY
# - YOUTUBE_COOKIES_FILE
# - YOUTUBE_USER_AGENT
# - YOUTUBE_CAPTION_LANGUAGES
# - KB_DECISIONS_MODEL
# - KB_GENERATION_MODEL
#
# `openrouter.stt_model` is currently TOML-backed rather than env-overridden.
# OPENROUTER_API_KEY / OPENROUTER_API_URL (or `[openrouter].api_key/api_url`)
# are shared by the STT provider, the decision model and the generation model.

[app]
name = "kb"
env = "development"

[log]
level = "info"

[vault]
root = "."
topic_globs = ["*"]

[okf]
# Local OKF concept type vocabulary. Empty means `kb okf check` will not warn
# about unknown types until the operator opts into a local standard. With a
# vocabulary, `kb promote` without --type asks the decision model to pick one
# (and warns when --type disagrees), so it then requires [decisions].
types = []

# Optional option text per type for those type suggestions; a type without a
# description is offered by its name. Example:
# [okf.type_descriptions]
# Playbook = "A step-by-step procedure someone follows to get a task done"
# Reference = "Facts, tables or definitions meant to be looked up"

[firecrawl]
api_key = ""
api_url = "https://api.firecrawl.dev"
# Fresh refetch before a quality gate judges a thin or broken capture: the
# refetch always bypasses Firecrawl's cache (maxAge 0), waits this long for
# client-side rendering, and keeps the full page unless set to true.
refetch_wait_ms = 3000
refetch_only_main_content = false

[openrouter]
# api_key/api_url are shared by the STT provider, [decisions] and [generation].
api_key = ""
api_url = "https://openrouter.ai/api"
stt_model = "google/gemini-2.5-flash"

[decisions]
# Decision model (Jev) over OpenRouter Decisions: POST <api_url>/alpha/decisions.
# Required by ingest, classify, link, find, promote and review; needs
# OPENROUTER_API_KEY. KB_DECISIONS_MODEL overrides the model.
model = "typesafe/jev-1.13"
# Total deadline of one attempt, including the body read.
deadline = "20s"
# Retries after the first attempt on 408/429/5xx, network errors and timeouts.
retries = 2
# Decision requests in flight per run; a 429 pauses the whole pool.
concurrency = 8
# Canonical JSON size cap of one decision state; larger states are
# not_checked:state_too_large (no call).
max_state_bytes = 98304
# Per-run spend ceiling in US$, shared with [generation]; `--budget` overrides.
budget_usd = 1.0
# Default decision mode: "shadow" records would-be outcomes, "apply" writes.
mode = "shadow"

[decisions.thresholds]
# Named thresholds (defaults shown; topic.yaml `decisions.thresholds` overrides
# them per topic). Every value must be within [0, 1].
# link_apply = 0.85
# link_review = 0.60
# mention_sense = 0.85
# affects = 0.80
# relevance_quarantine = 0.80
# relevance_review = 0.50
# relevance_fetch = 0.50
# quality_apply = 0.80
# quality_review = 0.50
# duplicate = 0.80
# primary_concept = 0.30
# concept_noul = 0.70
# find_keep = 0.50
# find_window = 0.35
# okf_type = 0.80
# contract_conflict = 0.70

[generation]
# Generation model for short literals (summaries, aliases, criteria, drafts)
# over OpenRouter chat completions with a strict JSON schema and reasoning
# disabled. KB_GENERATION_MODEL overrides the model.
model = "xiaomi/mimo-v2.6-flash"
# Tried once after the primary model fails; "" disables the fallback.
fallback_model = "deepseek/deepseek-v4-flash"
# Total deadline of one attempt.
deadline = "90s"
# Retries per model after the first attempt.
retries = 1
# Language generated summaries are written in.
summary_language = "en"

[stt]
provider = "openai"
api_key = ""
api_url = "https://api.openai.com"
model = "gpt-4o-transcribe"
language = "auto"
prompt = ""
audio_format = "mp3"
chunk_duration = "10m"
max_chunk_bytes = 24000000
concurrency = 2
ffmpeg_path = "ffmpeg"

[youtube]
yt_dlp_path = "yt-dlp"
proxy = ""
cookies_file = ""
user_agent = ""
transcription = "captions"
# Caption language preference order. "orig" means the video's original language
# from yt-dlp metadata. Translated automatic captions are disabled by default
# because YouTube serves them through a more aggressively rate-limited endpoint.
caption_languages = ["orig"]
allow_translated_captions = false
retry_attempts = 3
retry_backoff = "1s"
# Bulk channel/playlist ingestion (kb ingest channel): worker pool size, the
# inter-request throttle, the adaptive-backoff ceiling on YouTube rate limits,
# and per-video retries on a block. Keep concurrency low to avoid rate limiting.
bulk_concurrency = 2
bulk_throttle = "2s"
bulk_backoff_max = "60s"
bulk_retries = 3

[instagram]
# Controls `kb ingest instagram <url>` (reels, video posts, IGTV). Uses yt-dlp +
# STT, the same engine as YouTube. Cookies/proxy are kept separate from [youtube]
# because Instagram requires its own authenticated session. Public reels often
# work without cookies but Instagram rate-limits aggressively; set cookies_file
# (and optionally proxy) for reliable access.
yt_dlp_path = "yt-dlp"
proxy = ""
cookies_file = ""
user_agent = ""
# Reels rarely carry manual caption tracks, so the default policy is "auto":
# manual captions when present, otherwise Whisper STT. Use "stt" to always
# transcribe audio, or "captions" to require a caption track.
transcription = "auto"
retry_attempts = 3
retry_backoff = "1s"

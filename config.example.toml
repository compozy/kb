# kb runtime config.
#
# Set APP_CONFIG to point at this file if you want to load a TOML config.
# TOML sections currently accepted by internal/config:
# - `[app]`
# - `[log]`
# - `[vault]`
# - `[okf]`
# - `[firecrawl]`
# - `[browser]`
# - `[openrouter]`
# - `[whispercpp]`
# - `[stt]`
# - `[youtube]`
# - `[instagram]`
#
# Primary CLI surface is configured through commands and flags:
# - `kb topic {new,list,info}`
# - `kb ingest {url,file,youtube,channel,instagram,codebase,bookmarks}`
# - `kb lint`
# - `kb inspect ...`
# - `kb index`
# - `kb search`
#
# Runtime values and overrides loaded from the environment by internal/config:
# - APP_CONFIG
# - FIRECRAWL_API_KEY
# - FIRECRAWL_API_URL
# - OPENROUTER_API_KEY
# - OPENROUTER_API_URL
# - OPENAI_API_KEY
# - OPENAI_API_URL
# - STT_PROVIDER
# - STT_MODEL
# - YOUTUBE_YT_DLP_PATH
# - YOUTUBE_PROXY
# - YOUTUBE_COOKIES_FILE
# - YOUTUBE_USER_AGENT
# - YOUTUBE_CAPTION_LANGUAGES
#
# `openrouter.stt_model` is currently TOML-backed rather than env-overridden.

[app]
name = "kb"
env = "development"

[log]
level = "info"

[vault]
root = "."
topic_globs = ["*"]

[okf]
# Local OKF concept type vocabulary. Empty means `kb okf check` will not warn
# about unknown types until the operator opts into a local standard.
types = []

[firecrawl]
api_key = ""
api_url = "https://api.firecrawl.dev"

[browser]
# Optional Chrome/Chromium executable used by `kb ingest url --provider browser`
# or `kb ingest url --render`. Example: "/Applications/Google Chrome.app/.../Google Chrome"
command = ""

[openrouter]
api_key = ""
api_url = "https://openrouter.ai/api"
stt_model = "google/gemini-2.5-flash"

[stt]
# Supported providers: `openai`, `openrouter`, and `whispercpp`. The local
# whisper.cpp provider starts (or reuses) its configured server automatically
# and does not use `api_key` or `api_url`.
provider = "openai"
api_key = ""
api_url = "https://api.openai.com"
model = "gpt-4o-transcribe"
language = "auto"
prompt = ""
audio_format = "mp3"
chunk_duration = "10m"
max_chunk_bytes = 24000000
concurrency = 2
ffmpeg_path = "ffmpeg"

[whispercpp]
# Used only when `stt.provider = "whispercpp"`. `kb` starts this executable on
# demand when STT is needed and reuses a server already listening on host:port.
server_path = "whisper-server"
model_path = ""
host = "127.0.0.1"
port = 8188
startup_timeout = "30s"

[youtube]
yt_dlp_path = "yt-dlp"
proxy = ""
cookies_file = ""
user_agent = ""
transcription = "captions"
# Caption language preference order. "orig" means the video's original language
# from yt-dlp metadata. Translated automatic captions are disabled by default
# because YouTube serves them through a more aggressively rate-limited endpoint.
caption_languages = ["orig"]
allow_translated_captions = false
retry_attempts = 3
retry_backoff = "1s"
# Bulk channel/playlist ingestion (kb ingest channel): worker pool size, the
# inter-request throttle, the adaptive-backoff ceiling on YouTube rate limits,
# and per-video retries on a block. Keep concurrency low to avoid rate limiting.
bulk_concurrency = 2
bulk_throttle = "2s"
bulk_backoff_max = "60s"
bulk_retries = 3

[instagram]
# Controls `kb ingest instagram <url>` (reels, video posts, IGTV). Uses yt-dlp +
# STT, the same engine as YouTube. Cookies/proxy are kept separate from [youtube]
# because Instagram requires its own authenticated session. Public reels often
# work without cookies but Instagram rate-limits aggressively; set cookies_file
# (and optionally proxy) for reliable access.
yt_dlp_path = "yt-dlp"
proxy = ""
cookies_file = ""
user_agent = ""
# Reels rarely carry manual caption tracks, so the default policy is "auto":
# manual captions when present, otherwise Whisper STT. Use "stt" to always
# transcribe audio, or "captions" to require a caption track.
transcription = "auto"
retry_attempts = 3
retry_backoff = "1s"
